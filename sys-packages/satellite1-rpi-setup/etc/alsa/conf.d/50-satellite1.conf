
pcm.satellite1_playback {
    type plug
    slave {
      pcm "hw:Satellite1,0"
      format S32_LE
      rate 48000
      channels 2
    }
}

# Raw XMOS capture path for diagnostics/tests.
# Exposes the original 48 kHz stream from hw:Satellite1,1.
pcm.satellite1_capture_raw48 {
    type plug
    slave {
      pcm "hw:Satellite1,1"
      format S32_LE
      rate 48000
      channels 2
    }
}

# Capture downsample stage: 48 kHz -> 16 kHz.
# samplerate_order uses zero-order hold behavior.
pcm.satellite1_capture_decimate {
    type rate
    slave {
      pcm "satellite1_capture_raw48"
      format S32_LE
      rate 48000
      channels 2
    }
    converter "samplerate_order"
}

# User-facing capture endpoint.
# Keep this strict at 16 kHz so applications do not assume full-band 48 kHz.
pcm.satellite1_capture {
    type plug
    slave {
      pcm "satellite1_capture_decimate"
      format S32_LE
      rate 16000
      channels 2
    }
}

#
# Default devices
#
pcm.!default {
    type asym
    playback.pcm "satellite1_playback"
    capture.pcm "satellite1_capture"
}

#
# Control mixer
#
ctl.!default {
    type hw
    card "Satellite1"
}

#
# Global defaults for better resampling
#
defaults.pcm.rate_converter "samplerate_best"
