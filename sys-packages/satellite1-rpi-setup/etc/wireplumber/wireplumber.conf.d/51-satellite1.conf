# /etc/wireplumber/wireplumber.conf.d/51-satellite1.conf
#
# Plumb the Satellite1 I2S sound card into PipeWire.
#
# PipeWire/WirePlumber discover this card automatically from the kernel
# (device-tree overlay -> ALSA driver -> SPA ALSA monitor); no ALSA conf.d entry
# is needed for it to show up in `wpctl status`. All application audio goes
# through PipeWire via pipewire-alsa / pipewire-pulse, so the old raw-ALSA
# `pcm.!default` override (former etc/alsa/conf.d/50-satellite1.conf) was removed
# on purpose -- it bypassed PipeWire straight to hardware.
#
# This drop-in only TUNES how WirePlumber handles the card. The matches key off
# the ALSA card name ("Satellite1"); confirm the real device/node names on
# hardware with `wpctl status` and `wpctl inspect <id>`, and adjust if the
# match fails (e.g. switch to a node.name / device.name regex).
#
# Requires WirePlumber >= 0.5 (Trixie default), which uses this SPA-JSON format.

monitor.alsa.rules = [
  {
    # Fixed-format I2S codec: advertise the same format the hardware runs
    # (S32_LE / 48000 / 2ch, matching the old ALSA config) and keep the node
    # from suspending so the I2S bit clock stays up (avoids pops / dropped
    # first samples on capture + playback).
    matches = [
      { api.alsa.card.name = "Satellite1", node.name = "~alsa_output.*" }
      { api.alsa.card.name = "Satellite1", node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S32LE"
        audio.rate = 48000
        audio.channels = 2
        session.suspend-timeout-seconds = 0
      }
    }
  }
]