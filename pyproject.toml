[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite1-rpi"
description = "Control library for the Satellite1 Raspberry Pi HAT"
readme = "README.md"
authors = [{ name = "Mischa Siekmann", email = "mischa.siekmann@futureproofhomes.net" }]
license = { file = "LICENSE" }
dynamic = ["version"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "smbus2>=0.4",
    "spidev>=3.6 ; sys_platform == 'linux'",
    "RPi.GPIO>=0.7 ; sys_platform == 'linux' and (platform_machine == 'armv7l' or platform_machine == 'aarch64')",
]

requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pre-commit"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["satellite1", "satellite1.*"]

[project.scripts]
sat1 = "satellite1.cli.cli_sat1:main"
sat1-dac = "satellite1.cli.cli_dac:main"
sat1-speaker = "satellite1.cli.cli_dac:speaker"
sat1-lineout = "satellite1.cli.cli_dac:lineout"
sat1-xmos = "satellite1.cli.cli_xmos:xmos_main"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["spidev", "RPi", "RPi.*"]
ignore_missing_imports = true
